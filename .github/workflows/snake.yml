name: Generate Contribution Snake Animation

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0969da&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Strip letter artifacts (streak-only snake)
        run: |
          node -e '
          const fs = require("fs");
          ["dist/github-contribution-grid-snake.svg", "dist/github-contribution-grid-snake-dark.svg"].forEach(file => {
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              content = content.replace(/<rect class="c c[0-9a-z]+" x="([0-9.]+)"/g, (m, x) => {
                return parseFloat(x) < 706 ? `<rect class="c" x="${x}"` : m;
              });
              fs.writeFileSync(file, content);
            }
          });
          '

      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Repository for Streak Synchronization
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Auto-Update Daily Streak in README.md
        run: |
          node -e '
          const fs = require("fs");
          if (!fs.existsSync("README.md")) process.exit(0);
          let readme = fs.readFileSync("README.md", "utf8");
          const baseDate = new Date("2026-10-31T00:00:00Z");
          const now = new Date();
          const diffDays = Math.max(0, Math.floor((now - baseDate) / (1000 * 60 * 60 * 24)));
          const streak = 61 + diffDays;
          const score = 131 + (diffDays * 2);

          readme = readme.replace(/Cyber-Snake Eating My \d+-Day Streak/g, `Cyber-Snake Eating My ${streak}-Day Streak`);
          readme = readme.replace(/LEVEL-\d+%20DAYS%20STREAK-39D353/g, `LEVEL-${streak}%20DAYS%20STREAK-39D353`);
          readme = readme.replace(/SCORE-\d+(\+)?%20COMMITS-58A6FF/g, `SCORE-${score}+%20COMMITS-58A6FF`);
          fs.writeFileSync("README.md", readme);
          '

      - name: Commit and Push README Streak Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(arcade): auto-update daily streak [skip ci]"
            git push origin main
          else
            echo "README streak is already up to date."
          fi
